<main class="auth-page">
  <div class="auth-page__content">
    <div class="auth-logo">
      <svg class="auth-logo__icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path
          d="M24 5C12.4 5 3 12.9 3 22.6c0 5.5 3 10.4 7.7 13.6-.5 2.6-1.9 5-3.9 6.8 3.4.2 6.8-.8 9.6-2.8 2.4.7 4.9 1 7.6 1 11.6 0 21-7.9 21-17.6S35.6 5 24 5Z"
          fill="#797EF3"
        />
      </svg>
      <span class="auth-logo__text">DABubble</span>
    </div>

    <section class="auth-card">
      <a class="auth-back" routerLink="/login" aria-label="Zurück zum Login">
        <app-icon name="arrow-back" />
      </a>

      @if (hasCode) {
        <h1 class="auth-card__title">Passwort zurücksetzen</h1>

        <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
          <div class="auth-field">
            <label class="auth-field__pill">
              <app-icon class="auth-field__icon" name="lock" />
              <input
                class="auth-field__input"
                type="password"
                formControlName="password"
                autocomplete="new-password"
                placeholder="Neues Passwort"
              />
            </label>
          </div>

          <div class="auth-field">
            <label class="auth-field__pill" [class.auth-field__pill--invalid]="mismatchError()">
              <app-icon class="auth-field__icon" name="lock" />
              <input
                class="auth-field__input"
                type="password"
                formControlName="confirm"
                autocomplete="new-password"
                placeholder="Neues Kennwort bestätigen"
              />
            </label>
            <p class="auth-field__error" [class.is-visible]="mismatchError()" aria-live="polite">
              {{ mismatchError() }}
            </p>
          </div>

          <p class="auth-form-error" [class.is-visible]="formError()" role="alert">
            {{ formError() }}
          </p>

          <div class="reset__actions">
            <button
              type="submit"
              class="auth-btn auth-btn--primary"
              [disabled]="formInvalid() || loading()"
            >
              @if (loading()) {
                <app-spinner />
              } @else {
                Passwort ändern
              }
            </button>
          </div>
        </form>
      } @else {
        <h1 class="auth-card__title">Ungültiger Link</h1>
        <p class="auth-card__subtitle">
          Dieser Link ist ungültig oder unvollständig. Bitte fordere eine neue Passwort-Reset-Mail
          an.
        </p>

        <div class="reset__actions reset__actions--center">
          <a class="auth-btn auth-btn--primary" routerLink="/forgot-password">
            Neuen Link anfordern
          </a>
        </div>
      }
    </section>

    <app-legal-links />
  </div>
</main>

@if (success()) {
  <div class="toast-overlay" [class.toast-overlay--leaving]="leaving()">
    <app-toast message="Anmelden" />
  </div>
}
