<div class="workspace">
  <app-header variant="app"></app-header>

  <div class="workspace__columns">
    <div class="workspace__sidebar-area" [class.workspace__sidebar-area--closed]="!sidebarOpen()">
      @if (sidebarOpen()) {
        <app-sidebar
          (channelSelected)="onChannelSelected($event)"
          (userSelected)="onUserSelected($event)"
        ></app-sidebar>
      }

      <button
        type="button"
        class="workspace__sidebar-toggle"
        [attr.aria-label]="sidebarOpen() ? 'Workspace-Menü schließen' : 'Workspace-Menü öffnen'"
        (click)="toggleSidebar()"
      >
        <app-icon
          class="workspace__sidebar-toggle-icon"
          [name]="sidebarOpen() ? 'sidebar-close' : 'sidebar-open'"
        />

        <span class="workspace__sidebar-toggle-text">
          Workspace-Menü
          {{ sidebarOpen() ? 'schließen' : 'öffnen' }}
        </span>
      </button>
    </div>

    <div class="workspace__main">
      <app-main-chat
        [channel]="selectedChannel()"
        [user]="selectedUser()"
        (click)="onMainChatClick($event)"
        (replyClicked)="onReplyClicked($event)"
      ></app-main-chat>

      @if (addMembersOpen()) {
        @if (selectedChannel(); as channel) {
          <app-add-members [channelId]="channel.id" (closed)="closeAddMembers()" />
        }
      }
    </div>

    <app-thread [message]="activeThreadMessage()" (closed)="onThreadClosed()"></app-thread>
  </div>
</div>
