<header
  class="header"
  [class.header--auth-login]="variant === 'auth-login'"
  [class.header--auth-register]="variant === 'auth-register'"
  [class.header--app]="variant === 'app'"
  [class.header--mobile]="variant === 'mobile'"
>
  <div class="header__logo">
    <span class="header__logo--text">
      <img src="app-img/bubble-text.svg" alt="DABubble" />
    </span>

    <span class="header__logo--icon">
      <img src="app-img/bubble-logo.svg" alt="" />
    </span>
  </div>

  @if (variant === 'auth-login') {
    <div class="header__register">
      <span class="header__register-hint">Neu bei DABubble?</span>
      <div class="header__register-wrapper">
        <a class="header__link" routerLink="/register">Konto erstellen</a>
      </div>
    </div>
  }

  @if (variant === 'app') {
    <div class="header__search">
      <input type="text" placeholder="Devspace durchsuchen" />
    </div>

    <div class="header__user">
      <span>Frederik Beck</span>
      <img src="img/avatar/profile_blank.svg" alt="" />
    </div>
  }

  @if (variant === 'mobile') {
    <div class="header__avatar">
      <img src="img/avatar/profile_blank.svg" alt="Profil" />
    </div>
  }
</header>
