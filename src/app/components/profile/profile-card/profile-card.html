@if (editMode()) {
  <app-profile-edit (saved)="onEditSaved()" (closed)="onEditClosed()" />
} @else {
  <div class="dialog-backdrop" (click)="onBackdropClick()">
    <section class="dialog-card" (click)="$event.stopPropagation()">
      <header class="dialog-header">
        <h1 class="dialog-header__title">Profil</h1>
        <button
          type="button"
          class="dialog-header__close"
          (click)="onClose()"
          aria-label="Dialog schließen"
        >
          <app-icon name="close" />
        </button>
      </header>

      @if (user(); as u) {
        <div class="profile-avatar">
          <img [src]="u.avatarUrl" alt="" />
        </div>

        <div class="profile-identity">
          <h2 class="profile-identity__name">{{ u.name }}</h2>
          <p class="profile-identity__status">
            <span class="profile-identity__dot"></span>
            Aktiv
          </p>
        </div>

        <div class="profile-email">
          <app-icon class="profile-email__icon" name="mail" />
          <div class="profile-email__text">
            <span class="profile-email__label">E-Mail-Adresse</span>
            <a class="profile-email__link" [href]="'mailto:' + u.email">{{ u.email }}</a>
          </div>
        </div>

        <div class="dialog-actions">
          @if (isOwnProfile()) {
            <button type="button" class="profile-action" (click)="onEditClick()">
              <app-icon name="edit" />
              Bearbeiten
            </button>
          } @else {
            <button type="button" class="profile-action" (click)="onMessageClick()">
              <app-icon name="message" />
              Nachricht
            </button>
          }
        </div>
      } @else {
        <div class="profile-loading">
          <app-spinner />
        </div>
      }
    </section>
  </div>
}
